@if (isNavigating()) {
  <div class="site-loading-bar" role="progressbar" aria-label="Loading page">
    <span></span>
  </div>
}

<a
  href="#main-content"
  class="fixed left-4 top-4 z-[70] -translate-y-24 bg-[#252626] px-4 py-3 text-sm text-white transition-transform focus:translate-y-0"
>Skip to content</a>

<app-site-header />

<main id="main-content" tabindex="-1">
  <router-outlet />
</main>

<app-site-footer />

@if (showScrollTop()) {
  <button
    type="button"
    class="fixed bottom-5 right-5 z-40 flex size-12 items-center justify-center border border-white/30 bg-brand-charcoal text-xl text-white shadow-lg hover:bg-[#bc1b20] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#bc1b20]"
    aria-label="Scroll to the top of the page"
    (click)="scrollToTop()"
  >
    <span aria-hidden="true">↑</span>
  </button>
}
