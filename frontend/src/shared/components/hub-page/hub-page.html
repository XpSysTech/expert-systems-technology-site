<section class="border-b border-black/20">
  <div class="xpsys-container grid min-h-[34rem] content-between gap-14 py-10 md:py-16 lg:grid-cols-[1.45fr_0.75fr]">
    <div class="self-end">
      <p class="xpsys-kicker text-[#bc1b20]">{{ content.eyebrow }}</p>
      <h1 class="xpsys-display mt-8 max-w-[11ch]">{{ content.title }}</h1>
    </div>
    <div class="self-end border-t border-black/20 pt-5 lg:border-l lg:border-t-0 lg:pl-8">
      <p class="max-w-xl text-xl leading-snug md:text-2xl">{{ content.introduction }}</p>
      @if (content.ctaPath && content.ctaLabel) {
        <a [routerLink]="content.ctaPath" class="xpsys-button xpsys-button--red mt-9">{{ content.ctaLabel }} <span aria-hidden="true">→</span></a>
      }
    </div>
  </div>
</section>

<section class="xpsys-section">
  <div class="xpsys-container">
    <div class="grid border-t border-black/25 md:grid-cols-2 xl:grid-cols-3">
      @for (item of content.items; track item.code) {
        <app-equal-card [content]="item" />
      }
    </div>
  </div>
</section>

<section class="border-t border-black/20 bg-[#f2f2f0] py-12">
  <div class="xpsys-container flex flex-col gap-6 md:flex-row md:items-center md:justify-between">
    <p class="max-w-2xl text-2xl tracking-[-0.03em] md:text-3xl">Have an operational problem that does not fit a standard category?</p>
    <a routerLink="/contact" class="xpsys-button shrink-0">Discuss a requirement <span aria-hidden="true">→</span></a>
  </div>
</section>
